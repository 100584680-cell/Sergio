<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Álbum de Sergio</title>
  <meta name="description" content="Álbum de fotos de Sergio — nuestros mejores momentos juntos.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Work+Sans:wght@400;500;600&display=swap"
    rel="stylesheet">

  <style>
    :root {
      --color-bg: #F1EEE7;
      --color-surface: #FBFAF7;
      --color-ink: #2B2A26;
      --color-ink-soft: #6E6A5F;
      --color-accent: #35503F;
      --color-gold: #B8863B;
      --color-overlay: #1C1B18;

      --font-display: 'Fraunces', Georgia, serif;
      --font-body: 'Work Sans', system-ui, -apple-system, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--color-bg);
      color: var(--color-ink);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
    }

    img {
      max-width: 100%;
    }

    /* ---------- Cabecera ---------- */
    .hero {
      max-width: 720px;
      margin: 0 auto;
      padding: 3.5rem 1.5rem 2rem;
      text-align: center;
    }

    .hero .eyebrow {
      display: inline-block;
      font-family: var(--font-body);
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--color-gold);
      margin-bottom: 0.9rem;
    }

    .hero h1 {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: clamp(2rem, 5vw, 3rem);
      margin: 0 0 0.6rem;
      color: var(--color-ink);
    }

    .hero p {
      font-family: var(--font-display);
      font-style: italic;
      font-size: 1.05rem;
      color: var(--color-ink-soft);
      margin: 0;
    }

    /* ---------- Cuadrícula tipo "masonry" ---------- */
    .grid {
      column-count: 1;
      column-gap: 1.25rem;
      max-width: 1300px;
      margin: 0 auto;
      padding: 0.5rem 1.25rem 4rem;
    }

    @media (min-width: 640px) {
      .grid {
        column-count: 2;
      }
    }

    @media (min-width: 960px) {
      .grid {
        column-count: 3;
      }
    }

    @media (min-width: 1300px) {
      .grid {
        column-count: 4;
      }
    }

    .card {
      position: relative;
      break-inside: avoid;
      margin: 0 0 1.25rem;
      background: var(--color-surface);
      padding: 10px 10px 14px;
      border-radius: 2px;
      box-shadow: 0 1px 2px rgba(43, 42, 38, 0.08), 0 10px 22px -14px rgba(43, 42, 38, 0.35);
      cursor: zoom-in;
      opacity: 0;
      transform: translateY(14px);
      transition: opacity .5s ease, transform .5s ease, box-shadow .3s ease;
    }

    .card.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    .card:hover {
      box-shadow: 0 1px 2px rgba(43, 42, 38, 0.1), 0 16px 28px -14px rgba(43, 42, 38, 0.45);
    }

    .card:hover img {
      transform: scale(1.015);
    }

    .card::before,
    .card::after {
      content: "";
      position: absolute;
      width: 20px;
      height: 20px;
      background: var(--color-gold);
      opacity: 0.9;
      pointer-events: none;
    }

    .card::before {
      top: 0;
      left: 0;
      clip-path: polygon(0 0, 100% 0, 0 100%);
    }

    .card::after {
      bottom: 0;
      right: 0;
      clip-path: polygon(100% 100%, 0 100%, 100% 0);
    }

    .card img {
      display: block;
      width: 100%;
      border-radius: 1px;
      transition: transform .4s ease;
    }

    .card figcaption {
      margin-top: 0.6rem;
      font-family: var(--font-display);
      font-style: italic;
      font-size: 0.9rem;
      color: var(--color-ink-soft);
      text-align: center;
      padding: 0 0.2rem;
    }

    /* ---------- Visor / lightbox ---------- */
    #lightbox {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(28, 27, 24, 0.96);
      opacity: 0;
      pointer-events: none;
      transition: opacity .3s ease;
      padding: 1.5rem;
    }

    #lightbox.is-open {
      opacity: 1;
      pointer-events: auto;
    }

    #lightbox img {
      max-width: min(92vw, 1100px);
      max-height: 70vh;
      object-fit: contain;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
      transform: scale(0.96);
      transition: transform .3s ease;
    }

    #lightbox.is-open img {
      transform: scale(1);
    }

    #lightbox figcaption {
      color: #EFEAE0;
      font-family: var(--font-display);
      font-style: italic;
      font-size: 1rem;
      margin-top: 1rem;
      max-width: 600px;
      text-align: center;
    }

    #lightbox .counter {
      color: var(--color-gold);
      font-family: var(--font-body);
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      margin-top: 0.5rem;
    }

    .lb-btn {
      position: absolute;
      background: rgba(251, 250, 247, 0.1);
      border: 1px solid rgba(251, 250, 247, 0.25);
      color: #EFEAE0;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background .2s ease;
    }

    .lb-btn:hover {
      background: rgba(251, 250, 247, 0.22);
    }

    .lb-btn:focus-visible {
      outline: 2px solid var(--color-gold);
      outline-offset: 2px;
    }

    #lb-close {
      top: 1.25rem;
      right: 1.25rem;
    }

    #lb-prev {
      left: 1.25rem;
      top: 50%;
      transform: translateY(-50%);
    }

    #lb-next {
      right: 1.25rem;
      top: 50%;
      transform: translateY(-50%);
    }

    @media (max-width: 640px) {
      #lb-prev {
        left: 0.5rem;
      }

      #lb-next {
        right: 0.5rem;
      }
    }

    a:focus-visible,
    button:focus-visible,
    .card:focus-visible {
      outline: 2px solid var(--color-accent);
      outline-offset: 3px;
    }

    @media (prefers-reduced-motion: reduce) {

      .card,
      #lightbox,
      #lightbox img,
      .card img {
        transition: none !important;
      }

      .card {
        opacity: 1;
        transform: none;
      }
    }

    .empty-state {
      text-align: center;
      color: var(--color-ink-soft);
      font-family: var(--font-display);
      font-style: italic;
      padding: 3rem 1rem;
    }
  </style>
</head>

<body>

  <header class="hero">
    <span class="eyebrow" id="contador">Álbum compartido</span>
    <h1 id="titulo-album">Álbum de Sergio</h1>
    <p id="subtitulo-album">Nuestros mejores momentos juntos.</p>
  </header>

  <main class="grid" id="grid" aria-label="Galería de fotos"></main>

  <!-- Visor de foto ampliada -->
  <div id="lightbox" role="dialog" aria-modal="true" aria-label="Foto ampliada">
    <button class="lb-btn" id="lb-close" aria-label="Cerrar">✕</button>
    <button class="lb-btn" id="lb-prev" aria-label="Foto anterior">‹</button>
    <img id="lb-img" src="" alt="">
    <figcaption id="lb-caption"></figcaption>
    <div class="counter" id="lb-counter"></div>
    <button class="lb-btn" id="lb-next" aria-label="Foto siguiente">›</button>
  </div>

  <script>
    /* =========================================================
       ✏️  EDITA AQUÍ — esto es lo único que necesitas tocar
       =========================================================
       1) Cambia "titulo" y "subtitulo" si quieres.
       2) Dentro de "fotos", añade UNA LÍNEA por cada foto:
    
            { src: "fotos/nombre-de-la-foto.jpg", caption: "Texto opcional" }
    
          - src: la ruta hasta la imagen (mira las instrucciones que
            te han dado junto a este archivo para saber cómo nombrar
            y colocar tus fotos).
          - caption: un texto que aparece bajo la foto. Si no quieres
            ninguno, deja caption: ""
       3) No olvides la coma "," al final de cada línea, excepto en
          la última foto de la lista.
       4) Guarda el archivo. ¡Ya está!
    
       Ahora mismo hay fotos de ejemplo para que veas cómo queda.
       Sustitúyelas por las tuyas cuando estés listo.
       ========================================================= */
    const CONFIG = {
      titulo: "Álbum de Sergio",
      subtitulo: "-Mejores momementos-",
      fotos: [
        { src: "foto01.jpeg", caption: "" },
        { src: "foto02.jpeg", caption: "" },
        { src: "foto03.jpeg", caption: "" },
        { src: "foto04.jpeg", caption: "" },
        { src: "foto23.jpeg", caption: "" },
        { src: "foto29.jpeg", caption: "" },
        { src: "foto18.jpeg", caption: "" },
        { src: "foto15.jpeg", caption: "" },
        { src: "foto27.jpeg", caption: "" },
        { src: "foto30.jpeg", caption: "" },
        { src: "foto14.jpeg", caption: "" },
        { src: "IMG-20260808-WA0010.jpg", caption: "" },
        { src: "IMG-20260809-WA0013.jpg", caption: "" },
        { src: "IMG-20260809-WA0017.jpg", caption: "" },
        { src: "foto31.jpeg", caption: "" },
        { src: "foto07.jpeg", caption: "" },
        { src: "foto19.jpeg", caption: "" },
        { src: "foto20.jpeg", caption: "" },
        { src: "foto05.jpeg", caption: "" },
        { src: "foto28.jpeg", caption: "El peor error de Sergio" }
      ]
    };
    /* =========================================================
       NO TOQUES A PARTIR DE AQUÍ (a menos que sepas programar)
       ========================================================= */

    document.getElementById('titulo-album').textContent = CONFIG.titulo;
    document.getElementById('subtitulo-album').textContent = CONFIG.subtitulo;
    document.title = CONFIG.titulo;

    const grid = document.getElementById('grid');
    const contador = document.getElementById('contador');
    const fotos = CONFIG.fotos || [];

    if (fotos.length === 0) {
      grid.innerHTML = '<p class="empty-state">Todavía no se han añadido fotos.</p>';
      contador.textContent = 'Álbum compartido';
    } else {
      contador.textContent = fotos.length + (fotos.length === 1 ? ' foto — toca para ampliar' : ' fotos — toca para ampliar');

      fotos.forEach((foto, index) => {
        const figure = document.createElement('figure');
        figure.className = 'card';
        figure.tabIndex = 0;
        figure.setAttribute('role', 'button');
        figure.setAttribute('aria-label', 'Ampliar foto ' + (index + 1));

        const img = document.createElement('img');
        img.src = foto.src;
        img.alt = foto.caption || ('Foto ' + (index + 1));
        img.loading = 'lazy';

        figure.appendChild(img);

        if (foto.caption) {
          const caption = document.createElement('figcaption');
          caption.textContent = foto.caption;
          figure.appendChild(caption);
        }

        figure.addEventListener('click', () => openLightbox(index));
        figure.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            openLightbox(index);
          }
        });

        grid.appendChild(figure);
      });
    }

    /* Animación suave de aparición al hacer scroll */
    const cards = document.querySelectorAll('.card');
    if ('IntersectionObserver' in window) {
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('is-visible');
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.1, rootMargin: '0px 0px -40px 0px' });
      cards.forEach(card => observer.observe(card));
    } else {
      cards.forEach(card => card.classList.add('is-visible'));
    }

    /* ---------- Visor / lightbox ---------- */
    const lightbox = document.getElementById('lightbox');
    const lbImg = document.getElementById('lb-img');
    const lbCaption = document.getElementById('lb-caption');
    const lbCounter = document.getElementById('lb-counter');
    let currentIndex = 0;
    let lastFocused = null;

    function openLightbox(index) {
      currentIndex = index;
      updateLightboxContent();
      lastFocused = document.activeElement;
      lightbox.classList.add('is-open');
      document.body.style.overflow = 'hidden';
      document.getElementById('lb-close').focus();
    }

    function closeLightbox() {
      lightbox.classList.remove('is-open');
      document.body.style.overflow = '';
      if (lastFocused) lastFocused.focus();
    }

    function updateLightboxContent() {
      const foto = fotos[currentIndex];
      lbImg.src = foto.src;
      lbImg.alt = foto.caption || ('Foto ' + (currentIndex + 1));
      lbCaption.textContent = foto.caption || '';
      lbCounter.textContent = (currentIndex + 1) + ' / ' + fotos.length;
    }

    function showNext() {
      currentIndex = (currentIndex + 1) % fotos.length;
      updateLightboxContent();
    }

    function showPrev() {
      currentIndex = (currentIndex - 1 + fotos.length) % fotos.length;
      updateLightboxContent();
    }

    document.getElementById('lb-close').addEventListener('click', closeLightbox);
    document.getElementById('lb-next').addEventListener('click', showNext);
    document.getElementById('lb-prev').addEventListener('click', showPrev);

    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox) closeLightbox();
    });

    document.addEventListener('keydown', (e) => {
      if (!lightbox.classList.contains('is-open')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowRight') showNext();
      if (e.key === 'ArrowLeft') showPrev();
    });

    /* Deslizar con el dedo en móvil */
    let touchStartX = 0;
    lightbox.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].clientX;
    }, { passive: true });

    lightbox.addEventListener('touchend', (e) => {
      const touchEndX = e.changedTouches[0].clientX;
      const diff = touchEndX - touchStartX;
      if (Math.abs(diff) > 50) {
        diff > 0 ? showPrev() : showNext();
      }
    }, { passive: true });
  </script>

</body>

</html>
